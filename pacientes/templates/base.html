<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Centro Médico{% endblock %}</title>
    <!-- Materialize CSS CDN -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css" rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    {% block extra_head %}{% endblock %}
</head>
<body>
    <!-- Menú -->
    <nav>
        <div class="nav-wrapper teal">
            <a href="{% url 'index' %}" class="brand-logo" style="margin-left: 10px;">Centro Médico</a>
            <ul id="nav-mobile" class="right hide-on-med-and-down">
                <li><a href="{% url 'registrar' %}">Registrar Paciente</a></li>
                <li><a href="{% url 'listar' %}">Listado Pacientes</a></li>
            </ul>
        </div>
    </nav>

    <div class="container" style="margin-top: 30px;">
        {% block content %}{% endblock %}
    </div>

    <!-- Materialize JS CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
